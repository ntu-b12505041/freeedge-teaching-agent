services:
  - type: web
    name: freeedge-teaching-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TTS_PROVIDER
        value: edge
      - key: EDGE_TTS_VOICE
        value: en-US-GuyNeural
      - key: TARGET_WPM
        value: "142"
